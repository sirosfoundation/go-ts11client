name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test -v -race -coverprofile=cover.out -covermode=atomic ./...
      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v7
        with:
          files: cover.out
      - name: Convert coverage to Cobertura XML
        run: |
          go run github.com/boumenot/gocover-cobertura@v1.5.0 < cover.out > coverage.xml
      - name: Upload code coverage
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Go
          label: code-coverage/go-test
          # Code Quality is a repo-level feature toggle (Settings > Code
          # security > Code quality) separate from the branch-protection
          # rule that requires it - until that's enabled, this upload
          # fails with HTTP 403. Treat that as a warning, not a build
          # failure, so CI doesn't go red for a setting outside this
          # workflow's control. Once Code Quality is enabled, this can be
          # removed (or set back to the default "true") so a genuine
          # upload failure is caught again.
          fail-on-error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
